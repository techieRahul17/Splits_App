name: splits_app
description: A bill splitting app — track shared expenses, split items, pay via UPI.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Local storage
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # Navigation
  go_router: ^14.2.7

  # UUIDs
  uuid: ^4.4.2

  # UPI / share / url launch
  url_launcher: ^6.3.0
  share_plus: ^9.0.0

  # UI enhancements
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  gap: ^3.0.1
  flutter_slidable: ^3.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Generates the platform launcher icons from assets/icon/.
  # Regenerate with: dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

# Launcher icon generation. The source art lives in assets/icon/ and is not
# declared as a Flutter asset, since it is only used at build time.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  # Android 8+ adaptive icon: the launcher masks these two layers itself, so
  # the background must be full-bleed and un-rounded.
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
  # iOS forbids transparency in app icons.
  remove_alpha_ios: true
